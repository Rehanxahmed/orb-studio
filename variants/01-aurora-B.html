<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb — 01 Aurora Bloom (B · Inner sun)</title>
<!--
  Aurora Bloom / Inner sun: a WebGL1 fragment shader paints a translucent cream sphere lit from within. A soft bright core
  (two Gaussian lobes, #FFFDF3 heart → #FFF8DD scatter) drifts on a 1:2 Lissajous path (~R/3) and breathes, while slow
  domain-warped, ridged value-noise fbm draws wide gold caustic veils (#FBEEBD → #EFCF7E) and a faint peach shimmer, like
  sunlight through frosted glass. Everything is composed by interpolating inside the warm palette (never multiplied/darkened);
  sphere shading is in-shader: fresnel gold limb, honey shadow side, top-left sheen, 1px rim, AA edge. Noise offsets travel
  around circles and every frequency is an integer multiple of the 14s cycle, so the loop has no seam.
-->
<style>
  /* ---- shared framing: DO NOT change geometry/colors of the halo & rings unless the brief says so ---- */
  :root { --R: min(17vw, 9vh); }            /* orb radius → diameter 34vw on a phone (≈132px @390) */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #dcd6ea url(../assets/claude-bg.png) center 44% / cover no-repeat; }
  .stage { position: absolute; left: 50%; top: 44%; width: 0; height: 0; }
  .stage > * { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
  .halo { width: calc(var(--R) * 5.2); height: calc(var(--R) * 5.2); pointer-events: none;
          background: radial-gradient(circle, rgba(253,232,170,.62) 0%, rgba(253,232,170,.34) 22%, rgba(253,232,170,.12) 42%, rgba(253,232,170,0) 62%); }
  .ring { pointer-events: none; border: 1px solid rgba(255,255,255,.40); }
  .r1 { width: calc(var(--R) * 3.5); height: calc(var(--R) * 3.5); }
  .r2 { width: calc(var(--R) * 5.0); height: calc(var(--R) * 5.0); border-color: rgba(255,255,255,.32); }
  .r3 { width: calc(var(--R) * 6.6); height: calc(var(--R) * 6.6); border-color: rgba(255,255,255,.24); }
  .orb { width: calc(var(--R) * 2); height: calc(var(--R) * 2); overflow: hidden;
         /* reference body stays as the fallback / base under the shader; the outer glow lives here too */
         background: radial-gradient(circle at 38% 32%, #fffdf3 0%, #fff8dd 28%, #fbeebd 60%, #f3dfa2 100%);
         box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 -6px 14px rgba(232,190,110,.28),
                     0 0 40px 6px rgba(246,214,130,.45), 0 0 90px 20px rgba(246,214,130,.22); }
  .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div class="halo"></div>
    <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
    <div class="orb"><canvas id="c"></canvas></div>
  </div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;
uniform vec2  uRes;     // canvas size in device pixels
uniform float uPhase;   // 0..2π, loops every cycle

// ---- value noise (cheap, Safari-safe) ----
float hash(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// 3 octaves, rotated between octaves to hide the grid; ~0..1
float fbm(vec2 p){
  const mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
  float v = 0.0, amp = 0.5;
  for (int i = 0; i < 3; i++) { v += amp * vnoise(p); p = m * p * 2.03 + 11.7; amp *= 0.5; }
  return v / 0.875;
}

// ---- palette (sRGB), all warm & luminous ----
const vec3 HIGHLIGHT = vec3(1.000, 0.992, 0.953);  // #FFFDF3
const vec3 CREAM     = vec3(1.000, 0.973, 0.867);  // #FFF8DD
const vec3 MID       = vec3(0.984, 0.933, 0.741);  // #FBEEBD
const vec3 EDGE      = vec3(0.953, 0.875, 0.635);  // #F3DFA2
const vec3 GOLD      = vec3(0.937, 0.812, 0.494);  // #EFCF7E
const vec3 HONEY     = vec3(0.910, 0.725, 0.416);  // #E8B96A
const vec3 PEACH     = vec3(0.973, 0.851, 0.722);  // #F8D9B8

void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);  // -1..1, y up
  float r = length(p);
  float px = 2.0 / min(uRes.x, uRes.y);                              // one device pixel in p-units
  float ph = uPhase;

  // ---- sphere basis ----
  float z = sqrt(max(0.0, 1.0 - r * r));
  vec3  N = vec3(p, z);
  vec3  Ld = normalize(vec3(-0.55, 0.62, 0.75));
  float lam = dot(N, Ld) * 0.5 + 0.5;                // 0 (lower-right) .. 1 (upper-left)

  // ---- the inner sun: Lissajous drift (~R/3) with a small third harmonic, plus a breath ----
  vec2 core = vec2(0.32 * sin(ph + 0.4) + 0.05 * sin(3.0 * ph + 2.0),
                   0.28 * sin(2.0 * ph + 1.1) + 0.05 * cos(3.0 * ph + 0.6));
  float breath = 0.5 + 0.5 * sin(3.0 * ph + 0.7);    // 3 breaths per cycle (~4.7s each)
  float dc = length(p - core);
  float sig = 0.17 + 0.05 * breath;                   // heart radius
  float heart   = exp(-dc * dc / (2.0 * sig * sig));                        // tight bright heart
  float scatter = exp(-dc * dc / (2.0 * 0.46 * 0.46)) * (0.85 + 0.15 * breath); // wide soft scatter

  // ---- looping drift: noise offsets circle through noise space (period = one cycle) ----
  vec2 o1 = vec2(cos(ph),       sin(ph))       * 0.80;
  vec2 o2 = vec2(cos(ph + 2.1), sin(ph + 2.1)) * 0.65;
  vec2 o3 = vec2(cos(ph + 4.2), sin(ph + 4.2)) * 0.55;

  // ---- gold caustic veils: domain-warped, ridged fbm → wide soft bands with a brighter filament ----
  vec2 q  = vec2(fbm(p * 0.65 + o1), fbm(p * 0.65 + o2 + vec2(5.2, 1.3)));
  vec2 wp = p * 0.85 + (q - 0.5) * 1.30;
  float n  = fbm(wp + o3);
  float rg = 1.0 - abs(n - 0.5) * 2.1;                 // broad ridges where the field crosses its middle
  float veil = smoothstep(0.30, 1.00, rg);             // wide, soft gold veil (no hard spine)
  veil *= veil;                                        // ease the profile so the band has a feathered centre
  float fil  = smoothstep(0.78, 1.00, rg) * 0.5;       // very faint brighter breath along the veil's spine
  // peach shimmer: a second, slower field; lives only where the veil is not gold (never mixed with it)
  float ns = fbm(p * 0.9 - o2 * 0.6 + vec2(9.1, 3.7));
  float shimmer = smoothstep(0.52, 0.80, ns) * (1.0 - veil);

  // ---- body: cream base, a touch deeper than the reference core so the inner sun has room to glow ----
  float rh = length(p - vec2(-0.24, 0.36)) * 0.62;     // reference highlight anchor (38%,32%)
  vec3 col = mix(CREAM, MID, smoothstep(0.05, 0.75, rh));
  col = mix(col, EDGE, smoothstep(0.70, 1.10, rh));

  // veils: tint toward gold (weaker near the limb where fresnel gold already lives), filament lifts toward cream
  float limbFade = 1.0 - smoothstep(0.55, 1.0, r) * 0.55;
  vec3 veilCol = mix(MID, GOLD, 0.85);
  col = mix(col, veilCol, veil * 0.66 * limbFade);
  col = mix(col, CREAM, fil * 0.30 * limbFade);
  // peach shimmer against cream only
  col = mix(col, PEACH, shimmer * 0.30 * limbFade);

  // ---- inner sun: lighten toward the reference core/highlight, never darken ----
  col = mix(col, CREAM, scatter * 0.55);
  col = mix(col, HIGHLIGHT, heart * 0.90);
  col = mix(col, vec3(1.0), heart * heart * 0.25);

  // ---- sphere shading ----
  float fres = pow(smoothstep(0.30, 1.0, r), 1.5);
  // the limb is thinner glass on the side facing the core light → light leaks through, keep it a touch lighter there
  float toward = 0.5 + 0.5 * dot(normalize(p + vec2(1e-4)), normalize(core + vec2(1e-4)));
  col = mix(col, EDGE,  fres * (0.62 - 0.18 * toward * scatter));
  col = mix(col, HONEY, fres * 0.14 * (1.0 - lam));          // deeper honey on the shadow side
  col = mix(col, CREAM, (lam - 0.5) * 0.12);                // lit side lifted toward cream

  // broad glassy sheen top-left (no hard hotspot)
  vec3 H = normalize(vec3(-0.55, 0.62, 1.6));
  float sheen = pow(max(dot(N, H), 0.0), 5.0);
  col = mix(col, HIGHLIGHT, sheen * 0.36);
  float spec = pow(max(dot(N, H), 0.0), 18.0);
  col = mix(col, vec3(1.0), spec * 0.18);

  // thin bright rim (≈1px) just inside the edge, a little brighter on the core's side
  float rim = smoothstep(1.0 - px * 2.8, 1.0 - px * 1.3, r) * (1.0 - smoothstep(1.0 - px * 1.3, 1.0, r));
  col = mix(col, vec3(1.0), rim * (0.50 + 0.25 * toward));

  // sub-LSB dither so the long cream gradients never band
  col += (hash(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);
  col = clamp(col, 0.0, 1.0);

  // anti-aliased circular alpha
  float a = 1.0 - smoothstep(1.0 - px * 1.5, 1.0 + px * 0.2, r);
  gl_FragColor = vec4(col * a, a);   // premultiplied
}
</script>

<script>
(function () {
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: false })
        || canvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: true });
  if (!gl) return; // the .orb keeps its reference gradient as a static fallback

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : (gl.deleteShader(s), null);
  }
  var vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
  var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uPhase = gl.getUniformLocation(prog, 'uPhase');

  // ---- sizing: DPR-crisp, capped at 2 ----
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- timing: seamless 14s loop; reduced motion → 5× slower ----
  var CYCLE = 14000;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var speed = (mq && mq.matches) ? 0.2 : 1.0;
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { speed = e.matches ? 0.2 : 1.0; });

  var phase = 0, lastT = 0, raf = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = Math.min(t - lastT, 100); lastT = t;         // clamp so a tab-switch never jumps the loop
    phase = (phase + dt * speed / CYCLE) % 1;
    gl.uniform1f(uPhase, phase * Math.PI * 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function start() { if (!raf) { lastT = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  start();
})();
</script>
</body>
</html>
