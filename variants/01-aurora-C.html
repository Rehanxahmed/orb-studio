<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb — 01 Aurora Bloom (C: frosted aurora, big scale)</title>
<!--
  Aurora Bloom C: a WebGL1 fragment shader paints the orb body. A coarse 3-octave value-noise fbm warps the domain of a
  second, anisotropically stretched fbm so a few large aurora forms drift through the sphere; the whole field turns once
  per 40s master cycle while the noise offsets orbit at 2× and 3× that rate, so the loop is seamless. Colour is a pure lerp
  chain between luminous palette colours only (cream-white pockets → cream → gold pools, a peach band where they meet, a
  lavender whisper confined to the white pockets) — no darkening anywhere, so no muddy tones by construction. Sphere shading
  in-shader: top-left glassy sheen, light fresnel gold at the limb, a 1px bright rim and an anti-aliased circular alpha edge.
-->
<style>
  /* ---- shared framing: DO NOT change geometry/colors of the halo & rings unless the brief says so ---- */
  :root { --R: min(17vw, 9vh); }            /* orb radius → diameter 34vw on a phone (≈132px @390) */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #dcd6ea url(../assets/claude-bg.png) center 44% / cover no-repeat; }
  .stage { position: absolute; left: 50%; top: 44%; width: 0; height: 0; }
  .stage > * { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
  .halo { width: calc(var(--R) * 5.2); height: calc(var(--R) * 5.2); pointer-events: none;
          background: radial-gradient(circle, rgba(253,232,170,.62) 0%, rgba(253,232,170,.34) 22%, rgba(253,232,170,.12) 42%, rgba(253,232,170,0) 62%); }
  .ring { pointer-events: none; border: 1px solid rgba(255,255,255,.40); }
  .r1 { width: calc(var(--R) * 3.5); height: calc(var(--R) * 3.5); }
  .r2 { width: calc(var(--R) * 5.0); height: calc(var(--R) * 5.0); border-color: rgba(255,255,255,.32); }
  .r3 { width: calc(var(--R) * 6.6); height: calc(var(--R) * 6.6); border-color: rgba(255,255,255,.24); }
  .orb { width: calc(var(--R) * 2); height: calc(var(--R) * 2); overflow: hidden;
         /* reference body stays as the fallback / base under the shader; the outer glow lives here too */
         background: radial-gradient(circle at 38% 32%, #fffdf3 0%, #fff8dd 28%, #fbeebd 60%, #f3dfa2 100%);
         box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 -6px 14px rgba(232,190,110,.28),
                     0 0 40px 6px rgba(246,214,130,.45), 0 0 90px 20px rgba(246,214,130,.22); }
  .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div class="halo"></div>
    <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
    <div class="orb"><canvas id="c"></canvas></div>
  </div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;
uniform vec2  uRes;     // canvas size in device pixels
uniform float uPhase;   // 0..2π over the 40s master cycle (one field rotation)

// ---- value noise (cheap, Safari-safe) ----
float hash(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// 3 octaves, rotated between octaves to hide the grid
float fbm(vec2 p){
  const mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
  float v = 0.0, amp = 0.5;
  for (int i = 0; i < 3; i++) { v += amp * vnoise(p); p = m * p * 2.03 + 11.7; amp *= 0.5; }
  return v / 0.875; // normalise to ~0..1
}

// ---- palette (sRGB): every colour the body can show is one of these or a lerp between them ----
const vec3 WHITE    = vec3(1.000, 0.992, 0.953);  // #FFFDF3  highlight / cream-white pockets
const vec3 CREAM    = vec3(1.000, 0.973, 0.867);  // #FFF8DD  core cream
const vec3 EDGE     = vec3(0.953, 0.875, 0.635);  // #F3DFA2  reference edge gold
const vec3 GOLD     = vec3(0.937, 0.812, 0.494);  // #EFCF7E  gold pools
const vec3 PEACH    = vec3(0.973, 0.851, 0.722);  // #F8D9B8  fringe where cream meets gold
const vec3 LAVENDER = vec3(0.863, 0.816, 0.910);  // #DCD0E8  whisper, white pockets only

void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);  // -1..1, y up
  float r = length(p);
  float px = 2.0 / min(uRes.x, uRes.y);                              // one device pixel in p-units

  // ---- the whole aurora field turns once per cycle; drift offsets orbit at 2× / 3× so everything loops ----
  float ca = cos(uPhase), sa = sin(uPhase);
  vec2 f = mat2(ca, -sa, sa, ca) * p;
  vec2 o1 = vec2(cos(2.0 * uPhase),       sin(2.0 * uPhase))       * 0.60;
  vec2 o2 = vec2(cos(3.0 * uPhase + 1.7), sin(3.0 * uPhase + 1.7)) * 0.42;

  // ---- domain warp: coarse fbm bends the field; features are stretched along f.x so they read as bands ----
  vec2 q  = vec2(fbm(f * 0.75 + o1), fbm(f * 0.75 - o1.yx + vec2(4.3, 2.1)));
  vec2 wp = vec2(f.x * 0.80, f.y * 1.45) + (q - 0.5) * 1.0 + o2;
  float n  = fbm(wp);                                        // where the gold pools
  // faint curtain striations across the bands (bent by the warp) — a few % on the threshold, never a hard edge
  n += 0.025 * sin(f.y * 5.5 + (q.x - 0.5) * 5.0 + 3.0 * uPhase);
  float nT = fbm(wp * 0.7 + vec2(7.3, 2.9) - o1 * 0.5);      // fringe warmth / lavender whisper

  // ---- gold coverage: high-contrast but smooth, threshold breathes a little (2 breaths per cycle) ----
  float br = 0.035 * sin(2.0 * uPhase);
  float g  = smoothstep(0.33 + br, 0.67 + br, n);            // 0 = cream-white pocket … 1 = gold pool
  float fringe = g * (1.0 - g) * 4.0;                        // peaks on the g≈0.5 contour
  float peachAmt = 0.30 + 0.55 * smoothstep(0.35, 0.70, nT);

  // ---- colour: pure lerp chain through luminous palette colours ----
  vec3 col = mix(WHITE, CREAM, smoothstep(0.0, 0.45, g));
  col = mix(col, GOLD, smoothstep(0.30, 1.0, g));
  col = mix(col, PEACH, fringe * peachAmt);
  // lavender whisper: only inside the white pockets, on the sky-facing (upper-right) side
  float lav = smoothstep(0.55, 0.25, nT) * (1.0 - g) * (1.0 - g) * smoothstep(-0.2, 0.9, p.x - p.y * 0.3 + 0.1);
  col = mix(col, mix(WHITE, LAVENDER, 0.42), lav * 0.45);

  // ---- sphere shading (all lerps toward palette colours; nothing darkens) ----
  float z = sqrt(max(0.0, 1.0 - r * r));
  vec3  N = vec3(p, z);
  vec3  Ld = normalize(vec3(-0.55, 0.62, 0.75));
  float lam = dot(N, Ld) * 0.5 + 0.5;                        // 0 (lower-right) .. 1 (upper-left)
  float fres = pow(smoothstep(0.30, 1.0, r), 1.6);
  col = mix(col, mix(EDGE, GOLD, 0.55), fres * 0.62);         // light gold limb
  col = mix(col, GOLD, fres * 0.22 * (1.0 - lam));           // a touch deeper toward lower-right
  col = mix(col, WHITE, max(lam - 0.5, 0.0) * 0.22);         // lit side lifted

  // broad glassy sheen top-left (frosted, no hard hotspot) + a soft specular
  vec3 H = normalize(vec3(-0.55, 0.62, 1.6));
  float sheen = pow(max(dot(N, H), 0.0), 3.5);
  col = mix(col, WHITE, sheen * 0.54);
  float spec = pow(max(dot(N, H), 0.0), 18.0);
  col = mix(col, vec3(1.0), spec * 0.22);

  // thin bright rim (≈1px) just inside the edge
  float rim = smoothstep(1.0 - px * 2.8, 1.0 - px * 1.3, r) * (1.0 - smoothstep(1.0 - px * 1.3, 1.0, r));
  col = mix(col, vec3(1.0), rim * 0.55);

  col = clamp(col, 0.0, 1.0);

  // anti-aliased circular alpha
  float a = 1.0 - smoothstep(1.0 - px * 1.5, 1.0 + px * 0.2, r);
  gl_FragColor = vec4(col * a, a);   // premultiplied
}
</script>

<script>
(function () {
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: false })
        || canvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: true });
  if (!gl) return; // the .orb keeps its reference gradient as a static fallback

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : (gl.deleteShader(s), null);
  }
  var vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
  var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uPhase = gl.getUniformLocation(prog, 'uPhase');

  // ---- sizing: DPR-crisp, capped at 2 ----
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- timing: 40s master cycle (one field rotation; drift loops at 20s / 13.3s); reduced motion → 5× slower ----
  var CYCLE = 40000;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var speed = (mq && mq.matches) ? 0.2 : 1.0;
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { speed = e.matches ? 0.2 : 1.0; });

  var phase = 0, lastT = 0, raf = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = Math.min(t - lastT, 100); lastT = t;         // clamp so a tab-switch never jumps the loop
    phase = (phase + dt * speed / CYCLE) % 1;
    gl.uniform1f(uPhase, phase * Math.PI * 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function start() { if (!raf) { lastT = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  start();
})();
</script>
</body>
</html>
