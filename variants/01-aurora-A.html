<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb — 01 Aurora Bloom (A: silk ribbons)</title>
<!--
  Aurora Bloom / silk ribbons: a WebGL1 fragment shader paints the orb body. Two or three large diagonal bands of warm
  gold and peach travel slowly through a cream body; a 2-octave value-noise domain warp plus a phase-locked sine bend them
  so they undulate like silk curtains, and each gold fold carries a near-white luminous fringe on its trailing side.
  Sphere shading is in-shader (top-left sheen, deeper gold limb, 1px bright rim, anti-aliased edge). The band travel is
  exactly two periods per 14s cycle and the noise offsets circle in noise-space, so the loop has no seam.
-->
<style>
  /* ---- shared framing: DO NOT change geometry/colors of the halo & rings unless the brief says so ---- */
  :root { --R: min(17vw, 9vh); }            /* orb radius → diameter 34vw on a phone (≈132px @390) */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #dcd6ea url(../assets/claude-bg.png) center 44% / cover no-repeat; }
  .stage { position: absolute; left: 50%; top: 44%; width: 0; height: 0; }
  .stage > * { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
  .halo { width: calc(var(--R) * 5.2); height: calc(var(--R) * 5.2); pointer-events: none;
          background: radial-gradient(circle, rgba(253,232,170,.62) 0%, rgba(253,232,170,.34) 22%, rgba(253,232,170,.12) 42%, rgba(253,232,170,0) 62%); }
  .ring { pointer-events: none; border: 1px solid rgba(255,255,255,.40); }
  .r1 { width: calc(var(--R) * 3.5); height: calc(var(--R) * 3.5); }
  .r2 { width: calc(var(--R) * 5.0); height: calc(var(--R) * 5.0); border-color: rgba(255,255,255,.32); }
  .r3 { width: calc(var(--R) * 6.6); height: calc(var(--R) * 6.6); border-color: rgba(255,255,255,.24); }
  .orb { width: calc(var(--R) * 2); height: calc(var(--R) * 2); overflow: hidden;
         /* reference body stays as the fallback / base under the shader; the outer glow lives here too */
         background: radial-gradient(circle at 38% 32%, #fffdf3 0%, #fff8dd 28%, #fbeebd 60%, #f3dfa2 100%);
         box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), inset 0 -6px 14px rgba(232,190,110,.28),
                     0 0 40px 6px rgba(246,214,130,.45), 0 0 90px 20px rgba(246,214,130,.22); }
  .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div class="halo"></div>
    <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
    <div class="orb"><canvas id="c"></canvas></div>
  </div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;
uniform vec2  uRes;     // canvas size in device pixels
uniform float uPhase;   // 0..2π, loops every cycle

// ---- value noise (cheap, Safari-safe) ----
float hash(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// 2 octaves, rotated between octaves to hide the grid — deliberately coarse so the warp is broad, not mottled
float fbm2(vec2 p){
  const mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
  float v = 0.5 * vnoise(p);
  p = m * p * 2.03 + 11.7;
  v += 0.25 * vnoise(p);
  return v / 0.75; // normalise to ~0..1
}

// ---- palette (sRGB), all warm & luminous; GOLD is the darkest tone used anywhere ----
const vec3 HIGHLIGHT = vec3(1.000, 0.992, 0.953);  // #FFFDF3
const vec3 CREAM     = vec3(1.000, 0.973, 0.867);  // #FFF8DD
const vec3 MID       = vec3(0.984, 0.933, 0.741);  // #FBEEBD
const vec3 EDGE      = vec3(0.953, 0.875, 0.635);  // #F3DFA2
const vec3 GOLD      = vec3(0.937, 0.812, 0.494);  // #EFCF7E
const vec3 PEACH     = vec3(0.973, 0.851, 0.722);  // #F8D9B8
const vec3 LAVENDER  = vec3(0.863, 0.816, 0.910);  // #DCD0E8

// raised-cosine lobe centred on c with half-width w, on a periodic coordinate s in [0,1)
float lobe(float s, float c, float w){
  float d = abs(fract(s - c + 0.5) - 0.5);          // periodic distance to the centre
  float t = clamp(d / w, 0.0, 1.0);
  return 0.5 + 0.5 * cos(3.14159265 * t);
}

void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);  // -1..1, y up
  float r = length(p);
  float px = 2.0 / min(uRes.x, uRes.y);                              // one device pixel in p-units
  const float INV2PI = 0.15915494309;
  float ph = uPhase * INV2PI;                                        // 0..1 over the cycle

  // ---- sphere basis ----
  float z = sqrt(max(0.0, 1.0 - r * r));
  vec3  N = vec3(p, z);
  vec3  Ld = normalize(vec3(-0.55, 0.62, 0.75));
  float lam = dot(N, Ld) * 0.5 + 0.5;                // 0 (lower-right) .. 1 (upper-left)

  // ---- ribbon frame on mildly sphere-projected coords (bands compress a little toward the limb) ----
  vec2 ps = p / (0.62 + 0.38 * z);
  float d1 = ps.x * 0.55 + ps.y * 0.85;              // across the bands (travel direction, up-right)
  float d2 = ps.x * 0.85 - ps.y * 0.55;              // along the bands

  // ---- looping domain warp: coarse noise whose offsets circle slowly in noise-space + a phase-locked sine ----
  vec2 o1 = vec2(cos(uPhase),       sin(uPhase))       * 0.42;
  vec2 o2 = vec2(cos(uPhase + 2.4), sin(uPhase + 2.4)) * 0.36;
  float w1 = fbm2(vec2(d2 * 0.55, d1 * 0.85) + o1);
  float w2 = fbm2(vec2(d2 * 0.40, d1 * 0.60) * 1.7 + o2 + vec2(7.3, 2.1));
  float und = 0.11 * sin(d2 * 2.3 + uPhase + 1.2) + 0.03 * sin(d2 * 4.1 - 2.0 * uPhase + 0.4);
  float d1w = d1 + (w1 - 0.5) * 0.62 + (w2 - 0.5) * 0.14 + und;

  // ---- bands: period P, travel exactly 2 periods per cycle (R/4 per 1.5s at a 14s cycle) ----
  const float P = 1.1667;
  float s = fract(d1w / P - 2.0 * ph);
  // silk sheen along the fold: intensity breathes along d2 so the bands read as fabric, not stripes
  float sheenA = 0.70 + 0.30 * fbm2(vec2(d2 * 0.9, d1 * 0.35) - o2 * 0.8 + vec2(3.3, 8.8));
  float gold   = lobe(s, 0.30, 0.24) * sheenA;                 // wide warm-gold fold
  float fringe = lobe(s, 0.535, 0.075) * (0.75 + 0.25 * sheenA); // near-white light catching the fold edge
  float peach  = lobe(s, 0.79, 0.20) * (0.60 + 0.40 * sheenA);  // softer peach fold
  // hue drifts gold ↔ peach along the fold's length for richness
  float hue = fbm2(vec2(d2 * 0.5, d1 * 0.3) + o1 * 0.6 + vec2(11.0, 5.5));
  vec3 goldCol  = mix(GOLD, mix(GOLD, PEACH, 0.45), smoothstep(0.35, 0.80, hue));
  vec3 peachCol = mix(mix(PEACH, GOLD, 0.30), mix(PEACH, GOLD, 0.55), smoothstep(0.60, 0.25, hue)); // apricot, never rose

  // ---- body: cream base with the reference radial, then the ribbons laid on with plain warm interpolation ----
  float rh = length(p - vec2(-0.24, 0.36)) * 0.62;
  vec3 col = mix(HIGHLIGHT, CREAM, smoothstep(0.0, 0.30, rh));
  col = mix(col, MID,  smoothstep(0.30, 0.68, rh) * 0.55);
  col = mix(col, goldCol,  gold  * 0.93);
  col = mix(col, peachCol, peach * 0.72);
  col = mix(col, HIGHLIGHT, fringe * 0.85);

  // lavender whisper: cool upper-right only, never inside the gold, capped at 15%
  float cool = smoothstep(0.05, 0.95, (p.x * 0.8 + p.y * 0.6) * 0.9 + 0.1);
  float lav  = cool * (1.0 - gold) * (1.0 - fringe) * 0.15 * (0.6 + 0.4 * w2);
  col = mix(col, LAVENDER, lav);

  // ---- sphere shading (no tone darker than GOLD anywhere) ----
  float fres = pow(smoothstep(0.30, 1.0, r), 1.5);
  col = mix(col, EDGE, fres * 0.55);                          // gold toward the limb
  col = mix(col, GOLD, fres * 0.30 * (1.0 - lam));             // deeper gold on the shadow side
  col = mix(col, CREAM, max(lam - 0.5, 0.0) * 0.16);           // lit side lifted toward cream

  // broad glassy sheen top-left (no hard hotspot)
  vec3 H = normalize(vec3(-0.55, 0.62, 1.6));
  float sh = pow(max(dot(N, H), 0.0), 5.0);
  col = mix(col, HIGHLIGHT, sh * 0.40);
  float spec = pow(max(dot(N, H), 0.0), 18.0);
  col = mix(col, vec3(1.0), spec * 0.20);

  // thin bright rim (≈1px) just inside the edge
  float rim = smoothstep(1.0 - px * 2.8, 1.0 - px * 1.3, r) * (1.0 - smoothstep(1.0 - px * 1.3, 1.0, r));
  col = mix(col, vec3(1.0), rim * 0.55);

  // tiny dither so the slow gradients never band in 8-bit
  col += (hash(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);
  col = clamp(col, 0.0, 1.0);

  // anti-aliased circular alpha
  float a = 1.0 - smoothstep(1.0 - px * 1.5, 1.0 + px * 0.2, r);
  gl_FragColor = vec4(col * a, a);   // premultiplied
}
</script>

<script>
(function () {
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: false })
        || canvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: true });
  if (!gl) return; // the .orb keeps its reference gradient as a static fallback

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : (gl.deleteShader(s), null);
  }
  var vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
  var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uPhase = gl.getUniformLocation(prog, 'uPhase');

  // ---- sizing: DPR-crisp, capped at 2 ----
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(uRes, w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- timing: seamless 14s loop; reduced motion → 5× slower ----
  var CYCLE = 14000;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var speed = (mq && mq.matches) ? 0.2 : 1.0;
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { speed = e.matches ? 0.2 : 1.0; });

  var phase = 0, lastT = 0, raf = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = Math.min(t - lastT, 100); lastT = t;         // clamp so a tab-switch never jumps the loop
    phase = (phase + dt * speed / CYCLE) % 1;
    gl.uniform1f(uPhase, phase * Math.PI * 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function start() { if (!raf) { lastT = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  start();
})();
</script>
</body>
</html>
