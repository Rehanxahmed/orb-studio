<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb — 01 Aurora Bloom</title>
<!--
  Aurora Bloom (silk ribbons): a WebGL1 fragment shader paints the orb body. Large diagonal bands of warm gold and peach
  travel slowly through a cream body; a coarse value-noise domain warp plus a phase-locked sine bend them so they undulate
  like silk curtains, each gold fold carrying a near-white luminous fringe. Sphere shading is in-shader (top-left sheen,
  deeper gold limb, thin rim, anti-aliased edge). Every palette color and amount is a uniform driven by the control panel.
-->
<style>
  /* ---- shared framing, all tunable through CSS variables set by panel.js ---- */
  :root {
    --orb-scale: 1;
    --R: calc(min(17vw, 9vh) * var(--orb-scale));            /* orb radius → diameter 34vw on a phone (≈132px @390) */
    --c-hi: #fffdf3; --c-core: #fff8dd; --c-mid: #fbeebd; --c-edge: #f3dfa2;
    --orb-inner: inset 0 0 0 1px rgba(255,255,255,.6), inset 0 -6px 14px rgba(232,190,110,.3);
    --orb-outer: 0 0 40px 6px rgba(246,214,130,.45), 0 0 90px 20px rgba(246,214,130,.22);
    --halo-size: 5.2;
    --halo-bg: radial-gradient(circle, rgba(253,232,170,.62) 0%, rgba(253,232,170,.34) 22%, rgba(253,232,170,.12) 42%, rgba(253,232,170,0) 62%);
    --ring-w: 1px; --ring-1: rgba(255,255,255,.40); --ring-2: rgba(255,255,255,.32); --ring-3: rgba(255,255,255,.24); --ring-sp: 1; --rings-display: block;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .scene { position: absolute; inset: 0; overflow: hidden; background: #dcd6ea url(../assets/claude-bg.png) center 44% / cover no-repeat; }
  .stage { position: absolute; left: 50%; top: 44%; width: 0; height: 0; }
  .stage > * { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
  .halo { width: calc(var(--R) * var(--halo-size)); height: calc(var(--R) * var(--halo-size)); background: var(--halo-bg); pointer-events: none; }
  .ring { pointer-events: none; display: var(--rings-display); border: var(--ring-w) solid var(--ring-1); }
  .r1 { width: calc(var(--R) * 3.5 * var(--ring-sp)); height: calc(var(--R) * 3.5 * var(--ring-sp)); }
  .r2 { width: calc(var(--R) * 5.0 * var(--ring-sp)); height: calc(var(--R) * 5.0 * var(--ring-sp)); border-color: var(--ring-2); }
  .r3 { width: calc(var(--R) * 6.6 * var(--ring-sp)); height: calc(var(--R) * 6.6 * var(--ring-sp)); border-color: var(--ring-3); }
  .orb { width: calc(var(--R) * 2); height: calc(var(--R) * 2); overflow: hidden; box-shadow: var(--orb-outer);
         background: radial-gradient(circle at 38% 32%, var(--c-hi) 0%, var(--c-core) 28%, var(--c-mid) 60%, var(--c-edge) 100%); }
  .shade { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; box-shadow: var(--orb-inner); background: var(--shade-bg, none); }
  .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="scene">
    <div class="stage">
      <div class="halo"></div>
      <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
      <div class="orb"><canvas id="c"></canvas><div class="shade"></div></div>
    </div>
  </div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision mediump float;
uniform vec2  uRes;      // canvas size in device pixels
uniform float uPhase;    // 0..2π, loops every cycle
uniform vec3  uHi, uCream, uMid, uEdge, uGold, uPeach, uLav;
uniform float uPeriod, uAngle, uWarp, uUnd, uGoldAmt, uPeachAmt, uFringeAmt, uLavAmt;
uniform float uLimb, uShadow, uSheen, uSpec, uRim, uDir;

float hash(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0)), c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// 2 octaves, rotated between octaves — deliberately coarse so the warp is broad, not mottled
float fbm2(vec2 p){
  const mat2 m = mat2(0.80, 0.60, -0.60, 0.80);
  float v = 0.5 * vnoise(p);
  p = m * p * 2.03 + 11.7;
  v += 0.25 * vnoise(p);
  return v / 0.75;
}
// raised-cosine lobe centred on c with half-width w, on a periodic coordinate s in [0,1)
float lobe(float s, float c, float w){
  float d = abs(fract(s - c + 0.5) - 0.5);
  float t = clamp(d / w, 0.0, 1.0);
  return 0.5 + 0.5 * cos(3.14159265 * t);
}

void main(){
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / min(uRes.x, uRes.y);  // -1..1, y up
  float r = length(p);
  float px = 2.0 / min(uRes.x, uRes.y);
  const float INV2PI = 0.15915494309;
  float ph = uPhase * INV2PI;                                        // 0..1 over the cycle

  // ---- sphere basis ----
  float z = sqrt(max(0.0, 1.0 - r * r));
  vec3  N = vec3(p, z);
  vec3  Ld = normalize(vec3(-0.55, 0.62, 0.75));
  float lam = dot(N, Ld) * 0.5 + 0.5;

  // ---- ribbon frame on mildly sphere-projected coords ----
  vec2 ps = p / (0.62 + 0.38 * z);
  float ca = cos(uAngle), sa = sin(uAngle);
  float d1 = ps.x * ca + ps.y * sa;                  // across the bands (travel direction)
  float d2 = ps.x * sa - ps.y * ca;                  // along the bands

  // ---- looping domain warp ----
  vec2 o1 = vec2(cos(uPhase),       sin(uPhase))       * 0.42;
  vec2 o2 = vec2(cos(uPhase + 2.4), sin(uPhase + 2.4)) * 0.36;
  float w1 = fbm2(vec2(d2 * 0.55, d1 * 0.85) + o1);
  float w2 = fbm2(vec2(d2 * 0.40, d1 * 0.60) * 1.7 + o2 + vec2(7.3, 2.1));
  float und = uUnd * sin(d2 * 2.3 + uPhase + 1.2) + uUnd * 0.27 * sin(d2 * 4.1 - 2.0 * uPhase + 0.4);
  float d1w = d1 + (w1 - 0.5) * uWarp + (w2 - 0.5) * uWarp * 0.22 + und;

  // ---- bands: period uPeriod, travel exactly 2 periods per cycle ----
  float s = fract(d1w / uPeriod - 2.0 * ph * uDir);
  float sheenA = 0.70 + 0.30 * fbm2(vec2(d2 * 0.9, d1 * 0.35) - o2 * 0.8 + vec2(3.3, 8.8));
  float gold   = lobe(s, 0.30, 0.24) * sheenA;
  float fringe = lobe(s, 0.535, 0.075) * (0.75 + 0.25 * sheenA);
  float peach  = lobe(s, 0.79, 0.20) * (0.60 + 0.40 * sheenA);
  float hue = fbm2(vec2(d2 * 0.5, d1 * 0.3) + o1 * 0.6 + vec2(11.0, 5.5));
  vec3 goldCol  = mix(uGold, mix(uGold, uPeach, 0.45), smoothstep(0.35, 0.80, hue));
  vec3 peachCol = mix(mix(uPeach, uGold, 0.30), mix(uPeach, uGold, 0.55), smoothstep(0.60, 0.25, hue));

  // ---- body: cream base with the reference radial, then the ribbons ----
  float rh = length(p - vec2(-0.24, 0.36)) * 0.62;
  vec3 col = mix(uHi, uCream, smoothstep(0.0, 0.30, rh));
  col = mix(col, uMid, smoothstep(0.30, 0.68, rh) * 0.55);
  col = mix(col, goldCol,  gold  * uGoldAmt);
  col = mix(col, peachCol, peach * uPeachAmt);
  col = mix(col, uHi, fringe * uFringeAmt);

  // lavender whisper: cool upper-right only, never inside the gold
  float cool = smoothstep(0.05, 0.95, (p.x * 0.8 + p.y * 0.6) * 0.9 + 0.1);
  float lav  = cool * (1.0 - gold) * (1.0 - fringe) * uLavAmt * (0.6 + 0.4 * w2);
  col = mix(col, uLav, lav);

  // ---- sphere shading ----
  float fres = pow(smoothstep(0.30, 1.0, r), 1.5);
  col = mix(col, uEdge, fres * uLimb);
  col = mix(col, uGold, fres * uShadow * (1.0 - lam));
  col = mix(col, uCream, max(lam - 0.5, 0.0) * 0.16);

  vec3 H = normalize(vec3(-0.55, 0.62, 1.6));
  float sh = pow(max(dot(N, H), 0.0), 5.0);
  col = mix(col, uHi, sh * uSheen);
  float spec = pow(max(dot(N, H), 0.0), 18.0);
  col = mix(col, vec3(1.0), spec * uSpec);

  // thin bright rim just inside the edge
  float rim = smoothstep(1.0 - px * 2.8, 1.0 - px * 1.3, r) * (1.0 - smoothstep(1.0 - px * 1.3, 1.0, r));
  col = mix(col, vec3(1.0), rim * uRim);

  col += (hash(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);   // dither against banding
  col = clamp(col, 0.0, 1.0);

  float a = 1.0 - smoothstep(1.0 - px * 1.5, 1.0 + px * 0.2, r);
  gl_FragColor = vec4(col * a, a);   // premultiplied
}
</script>

<script src="panel.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: false })
        || canvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: true });
  var U = {};
  if (gl) {
    var compile = function (type, src) {
      var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); gl.deleteShader(s); return null; }
      return s;
    };
    var vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
    var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
    if (vs && fs) {
      var prog = gl.createProgram();
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        gl.useProgram(prog);
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(prog, 'a');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        ['uRes','uPhase','uHi','uCream','uMid','uEdge','uGold','uPeach','uLav','uPeriod','uAngle','uWarp','uUnd','uGoldAmt','uPeachAmt','uFringeAmt','uLavAmt','uLimb','uShadow','uSheen','uSpec','uRim','uDir']
          .forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
      } else gl = null;
    } else gl = null;
  }

  function resize() {
    if (!gl) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.uRes, w, h);
  }
  window.addEventListener('resize', resize);

  // ---- parameters (control panel) ----
  var CYCLE = 14000, paused = false;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var speed = (mq && mq.matches) ? 0.2 : 1.0;
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { speed = e.matches ? 0.2 : 1.0; });

  function c3(name, hex) { var c = OrbPanel.hexToRgb(hex); gl.uniform3f(U[name], c.r / 255, c.g / 255, c.b / 255); }
  function apply(p) {
    OrbPanel.applyShell(p);
    CYCLE = p.cycle * 1000; paused = !!p.paused;
    document.documentElement.style.setProperty('--c-hi', p.highlight);
    document.documentElement.style.setProperty('--c-core', p.cream);
    document.documentElement.style.setProperty('--c-mid', p.mid);
    document.documentElement.style.setProperty('--c-edge', p.edge);
    if (!gl) return;
    resize();
    c3('uHi', p.highlight); c3('uCream', p.cream); c3('uMid', p.mid); c3('uEdge', p.edge);
    c3('uGold', p.gold); c3('uPeach', p.peach); c3('uLav', p.lavender);
    gl.uniform1f(U.uPeriod, p.period); gl.uniform1f(U.uAngle, p.angle * Math.PI / 180);
    gl.uniform1f(U.uWarp, p.warp); gl.uniform1f(U.uUnd, p.undulation);
    gl.uniform1f(U.uGoldAmt, p.goldAmt); gl.uniform1f(U.uPeachAmt, p.peachAmt);
    gl.uniform1f(U.uFringeAmt, p.fringeAmt); gl.uniform1f(U.uLavAmt, p.lavAmt);
    gl.uniform1f(U.uLimb, p.limb); gl.uniform1f(U.uShadow, p.shadowGold);
    gl.uniform1f(U.uSheen, p.sheen); gl.uniform1f(U.uSpec, p.spec); gl.uniform1f(U.uRim, p.shaderRim);
    gl.uniform1f(U.uDir, p.reverse ? -1 : 1);
  }

  OrbPanel.create({
    id: '01-aurora', title: 'Aurora Bloom',
    groups: [
      { name: 'Animation', controls: [
        { key: 'cycle', label: 'Cycle length', type: 'range', min: 4, max: 40, step: 0.5, value: 14, unit: 's' },
        { key: 'reverse', label: 'Reverse travel', type: 'toggle', value: false } ] },
      { name: 'Ribbons', controls: [
        { key: 'period', label: 'Band period', type: 'range', min: 0.5, max: 3, step: 0.01, value: 1.17 },
        { key: 'angle', label: 'Band angle', type: 'range', min: 0, max: 180, step: 1, value: 57, unit: '°' },
        { key: 'warp', label: 'Warp', type: 'range', min: 0, max: 1.5, step: 0.01, value: 0.62 },
        { key: 'undulation', label: 'Undulation', type: 'range', min: 0, max: 0.4, step: 0.01, value: 0.11 },
        { key: 'goldAmt', label: 'Gold fold', type: 'range', min: 0, max: 1, step: 0.01, value: 0.93 },
        { key: 'peachAmt', label: 'Peach fold', type: 'range', min: 0, max: 1, step: 0.01, value: 0.72 },
        { key: 'fringeAmt', label: 'Light fringe', type: 'range', min: 0, max: 1, step: 0.01, value: 0.85 },
        { key: 'lavAmt', label: 'Lavender whisper', type: 'range', min: 0, max: 0.5, step: 0.01, value: 0.15 } ] },
      { name: 'Sphere shading', controls: [
        { key: 'limb', label: 'Gold limb', type: 'range', min: 0, max: 1, step: 0.01, value: 0.55 },
        { key: 'shadowGold', label: 'Shadow side', type: 'range', min: 0, max: 1, step: 0.01, value: 0.30 },
        { key: 'sheen', label: 'Sheen', type: 'range', min: 0, max: 1, step: 0.01, value: 0.40 },
        { key: 'spec', label: 'Specular', type: 'range', min: 0, max: 0.6, step: 0.01, value: 0.20 },
        { key: 'shaderRim', label: 'Inner rim light', type: 'range', min: 0, max: 1, step: 0.01, value: 0.55 } ] },
      { name: 'Colors', controls: [
        { key: 'highlight', label: 'Highlight', type: 'color', value: '#fffdf3' },
        { key: 'cream', label: 'Cream body', type: 'color', value: '#fff8dd' },
        { key: 'mid', label: 'Mid tone', type: 'color', value: '#fbeebd' },
        { key: 'edge', label: 'Edge gold', type: 'color', value: '#f3dfa2' },
        { key: 'gold', label: 'Gold fold', type: 'color', value: '#efcf7e' },
        { key: 'peach', label: 'Peach fold', type: 'color', value: '#f8d9b8' },
        { key: 'lavender', label: 'Lavender', type: 'color', value: '#dcd0e8' } ] }
    ].concat(OrbPanel.shellGroups({ rimAlpha: 0.35, ishAlpha: 0.22, ishY: -6, ishBlur: 14 })),
    apply: apply
  });

  var phase = 0, lastT = 0, raf = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (!gl) return;
    if (!lastT) lastT = t;
    var dt = Math.min(t - lastT, 100); lastT = t;
    if (!paused) phase = (phase + dt * speed / CYCLE) % 1;
    gl.uniform1f(U.uPhase, phase * Math.PI * 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function start() { if (!raf) { lastT = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  resize();
  start();
})();
</script>
</body>
</html>
