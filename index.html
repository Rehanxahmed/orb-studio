<title>Orb Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* ---------- studio chrome tokens (light) ---------- */
  :root {
    --ground: #ece9f3;
    --surface: rgba(255, 255, 255, .66);
    --surface-solid: #f7f5fb;
    --ink: #2a2640;
    --muted: #7b7692;
    --hair: rgba(58, 50, 100, .10);
    --hair-strong: rgba(58, 50, 100, .18);
    --accent: #d9ac3f;
    --accent-ink: #6b5a2c;
    --accent-soft: #f5e7bf;
    --track: rgba(58, 50, 100, .16);
    --thumb: #ffffff;
    --shadow: 0 24px 60px -30px rgba(58, 50, 100, .55);
    --device-shadow: 0 0 0 1px rgba(58, 50, 100, .10), 0 40px 80px -40px rgba(58, 50, 100, .55);
    --field: rgba(255, 255, 255, .7);
    --control: rgba(58, 50, 100, .08);
    --control-hover: rgba(58, 50, 100, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15131d;
      --surface: rgba(34, 31, 46, .72);
      --surface-solid: #211e2c;
      --ink: #ede9f5;
      --muted: #9c97b0;
      --hair: rgba(255, 255, 255, .08);
      --hair-strong: rgba(255, 255, 255, .16);
      --accent: #e5c25f;
      --accent-ink: #f3dfa2;
      --accent-soft: #3b3320;
      --track: rgba(255, 255, 255, .16);
      --thumb: #f2eefa;
      --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
      --device-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 40px 80px -40px rgba(0, 0, 0, .9);
      --field: rgba(255, 255, 255, .06);
      --control: rgba(255, 255, 255, .08);
      --control-hover: rgba(255, 255, 255, .14);
    }
  }
  :root[data-theme="dark"] {
    --ground: #15131d;
    --surface: rgba(34, 31, 46, .72);
    --surface-solid: #211e2c;
    --ink: #ede9f5;
    --muted: #9c97b0;
    --hair: rgba(255, 255, 255, .08);
    --hair-strong: rgba(255, 255, 255, .16);
    --accent: #e5c25f;
    --accent-ink: #f3dfa2;
    --accent-soft: #3b3320;
    --track: rgba(255, 255, 255, .16);
    --thumb: #f2eefa;
    --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
    --device-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 40px 80px -40px rgba(0, 0, 0, .9);
    --field: rgba(255, 255, 255, .06);
    --control: rgba(255, 255, 255, .08);
    --control-hover: rgba(255, 255, 255, .14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden;
         font: 13px/1.4 "Instrument Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--hair); flex: 0 0 auto; }
  .wordmark { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-style: italic; font-size: 22px; letter-spacing: -.01em; line-height: 1; margin-right: 4px; }
  .wordmark small { font-family: "Instrument Sans", system-ui, sans-serif; font-style: normal; font-size: 11px; color: var(--muted); margin-left: 8px; letter-spacing: .04em; text-transform: uppercase; }
    .spacer { flex: 1; }
  .btn { border: 0; border-radius: 8px; padding: 6px 11px; background: var(--control); color: var(--ink); cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--control-hover); }
  .btn.on { background: var(--accent-soft); color: var(--accent-ink); }
  .btn.primary { background: var(--accent); color: #2a2640; }
  .btn.primary:hover { filter: brightness(1.05); }

  /* ---------- workspace ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
  .scene { position: relative; overflow: hidden; flex: 0 0 auto;

  .caption { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .02em; pointer-events: none; }

  /* orb geometry — every value below is driven by the panel through CSS variables */
  :root {
    --orb-scale: 1;
    --R: calc(66.3px * var(--device-scale, 1) * var(--orb-scale));
    --orb-bg: radial-gradient(circle at 38% 32%, #fffdf3 0%, #fff8dd 28%, #fbeebd 60%, #f3dfa2 100%);
    --orb-inner: inset 0 0 0 1px rgba(255,255,255,.6), inset 0 -6px 14px rgba(232,190,110,.3);
    --orb-outer: 0 0 40px 6px rgba(246,214,130,.45), 0 0 90px 20px rgba(246,214,130,.22);
    --halo-size: 5.2;
    --halo-bg: radial-gradient(circle, rgba(253,232,170,.62) 0%, rgba(253,232,170,.34) 22%, rgba(253,232,170,.12) 42%, rgba(253,232,170,0) 62%);
    --ring-w: 1px; --ring-1: rgba(255,255,255,.40); --ring-2: rgba(255,255,255,.32); --ring-3: rgba(255,255,255,.24); --ring-sp: 1; --rings-display: block;
    --liquid-blur: calc(var(--R) * 0.13);
  }
  .orbstage { position: absolute; left: 50%; top: 44%; width: 0; height: 0; }
  .orbstage > * { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
  .halo { width: calc(var(--R) * var(--halo-size)); height: calc(var(--R) * var(--halo-size)); background: var(--halo-bg); pointer-events: none; }
  .ring { pointer-events: none; display: var(--rings-display); border: var(--ring-w) solid var(--ring-1); }
  .r1 { width: calc(var(--R) * 3.5 * var(--ring-sp)); height: calc(var(--R) * 3.5 * var(--ring-sp)); }
  .r2 { width: calc(var(--R) * 5.0 * var(--ring-sp)); height: calc(var(--R) * 5.0 * var(--ring-sp)); border-color: var(--ring-2); }
  .r3 { width: calc(var(--R) * 6.6 * var(--ring-sp)); height: calc(var(--R) * 6.6 * var(--ring-sp)); border-color: var(--ring-3); }
  .orb { width: calc(var(--R) * 2); height: calc(var(--R) * 2); overflow: hidden; box-shadow: var(--orb-outer); background: var(--orb-bg); }
  .liquid { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; transform: translateZ(0); -webkit-transform: translateZ(0); isolation: isolate; }
  .liquid canvas { position: absolute; left: -35%; top: -35%; width: 170%; height: 170%; display: block; filter: blur(var(--liquid-blur)); -webkit-filter: blur(var(--liquid-blur)); }
  .gloss { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .shade { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; box-shadow: var(--orb-inner); background: var(--shade-bg, none); }

  /* ---------- control panel ---------- */
  .panel { flex: 0 0 320px; display: flex; flex-direction: column; min-height: 0; margin: 14px 14px 14px 0; border-radius: 16px;
           background: var(--surface); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
           box-shadow: 0 0 0 1px var(--hair), var(--shadow); overflow: hidden; }
  .panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--hair); }
  .panel-head h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: 22px; line-height: 1.1; letter-spacing: -.01em; }
  .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; text-wrap: pretty; }
  .panel-body { flex: 1; overflow: auto; padding: 4px 0 10px; overscroll-behavior: contain; }
  .group { border-bottom: 1px solid var(--hair); }
  .group-h { display: flex; align-items: center; width: 100%; padding: 10px 16px 8px; border: 0; background: none; cursor: pointer; text-align: left;
             font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .group-h::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
  .group.closed .group-h::after { transform: rotate(-45deg); }
  .group.closed .group-c { display: none; }
  .group-c { padding: 0 16px 8px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 4px 0; }
  .row label { color: var(--ink); }
  .row .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; }
  .row input[type=range] { grid-column: 1 / 3; width: 100%; margin: 2px 0 0; -webkit-appearance: none; appearance: none; height: 18px; background: transparent; }
  .row input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--track); }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--thumb); box-shadow: 0 0 0 1px var(--hair-strong), 0 2px 6px rgba(0, 0, 0, .2); }
  .row input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track); }
  .row input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--thumb); box-shadow: 0 0 0 1px var(--hair-strong), 0 2px 6px rgba(0, 0, 0, .2); }
  .color { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .color input[type=color] { -webkit-appearance: none; appearance: none; width: 26px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
  .color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .color input[type=color]::-webkit-color-swatch { border-radius: 6px; border: 1px solid var(--hair-strong); }
  .color input[type=text] { width: 68px; font: inherit; font-size: 11px; font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--hair-strong); background: var(--field); color: var(--ink); }
  .toggle { width: 34px; height: 20px; border: 0; padding: 0; border-radius: 10px; background: var(--track); position: relative; cursor: pointer; justify-self: end; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--thumb); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: left .15s; }
  .toggle[aria-pressed="true"] { background: var(--accent); }
  .toggle[aria-pressed="true"]::after { left: 16px; }
  .panel-foot { padding: 9px 16px; border-top: 1px solid var(--hair); color: var(--muted); font-size: 11px; }
  .panel-actions { display: none; gap: 8px; margin-top: 10px; }
  .panel-actions .primary { margin-left: auto; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 8px); padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--ground); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fab { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 15; padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow); }

  /* ---------- narrow screens: the panel becomes a drawer ---------- */
  @media (max-width: 860px) {
    .top { padding: 10px 12px; gap: 10px; }
    .wordmark small { display: none; }
    .top .btn.text { display: none; }
    .stage { padding: 12px; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; flex: none; height: 62vh; height: 62dvh; border-radius: 18px 18px 0 0;
             transform: translateY(100%); transition: transform .22s ease; z-index: 12; }
    .panel.open { transform: translateY(0); }
    .fab { display: block; }
    .fab.hide { display: none; }
    .panel-actions { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) { .panel, .toast, .toggle::after { transition: none; } }

  select(state.orb);
  start();
})();
